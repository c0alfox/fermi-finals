[package]
name = "wss"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "^1.45", features = ["macros", "sync", "rt-multi-thread"] }
tokio-stream = "^0.1.17"
warp = "^0.3.7"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
futures = { version = "^0.3", default-features = false }
uuid = { version = "^1.16", features = ["serde", "v4"] }
